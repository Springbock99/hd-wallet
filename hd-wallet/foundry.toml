[profile.default]
src = "contracts"
out = "out"
libs = ["lib", "dependencies"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
test = "test"
verbosity = 2
ffi = true

remappings = [
  "forge-std/=dependencies/forge-std-1.9.6/src/",
  "@oppenzeppelin-contracts/=dependencies/@openzeppelin-contracts-5.2.0/"
]

# [rpc_endpoints]
# local = "http://localhost:8545"
# sepolia = "https://sepolia.infura.io/v3/YOUR_INFURA_KEY"

# [etherscan]
# sepolia = { key = "YOUR_ETHERSCAN_API_KEY" }

[dependencies]
forge-std = "1.9.6"
"@openzeppelin-contracts" = "5.2.0"
